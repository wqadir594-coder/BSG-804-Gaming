<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090B" />
    <title>Offline — BSG 804 Gaming</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100dvh;
        background-color: #09090b;
        background-image:
          radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.16), transparent 55%),
          radial-gradient(circle at 80% 100%, rgba(212, 175, 55, 0.08), transparent 45%);
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .shell {
        width: 100%;
        max-width: 480px;
        background: #111115;
        border: 1px solid #27272a;
        border-radius: 16px;
        padding: 36px 28px;
        text-align: center;
      }
      .crest {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .kicker {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #d4af37;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #a1a1aa;
        margin-bottom: 24px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      button,
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: none;
        transition: transform 0.15s ease, background-color 0.15s ease;
      }
      .btn-primary {
        background: #dc2626;
        color: #ffffff;
      }
      .btn-primary:hover {
        background: #b91c1c;
      }
      .btn-secondary {
        background: #18181b;
        color: #e4e4e7;
        border: 1px solid #27272a;
      }
      .btn-secondary:hover {
        background: #27272a;
      }
      .meta {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid #27272a;
        font-size: 12px;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="crest" aria-hidden="true">
        <svg viewBox="0 0 100 100" width="72" height="72" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 6 L88 20 V50 C88 73 71 89 50 96 C29 89 12 73 12 50 V20 Z" fill="#18181B" stroke="#D4AF37" stroke-width="4" />
          <polygon points="24,30 50,20 76,30 76,39 50,29 24,39" fill="#DC2626" />
          <text x="50" y="57" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="20" fill="#FAFAFA">BSG</text>
          <rect x="30" y="62" width="40" height="13" rx="3" fill="#D4AF37" />
          <text x="50" y="72" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="10" fill="#09090B">804</text>
        </svg>
      </div>
      <div class="kicker">Connection Unavailable</div>
      <h1>BSG 804 Gaming is Offline</h1>
      <p>
        Your device is not connected to the internet right now. Reconnect to sync live tournament brackets, match schedules, and tryout submissions.
      </p>
      <div class="actions">
        <button type="button" class="btn-primary" onclick="window.location.reload()">
          Retry Connection
        </button>
        <a href="/" class="btn-secondary">
          Return to Cached Home
        </a>
      </div>
      <div class="meta">
        BSG 804 Gaming · Standalone PWA Mode
      </div>
    </main>
    <script>
      window.addEventListener('online', () => {
        window.location.replace('/');
      });
    </script>
  </body>
</html>
