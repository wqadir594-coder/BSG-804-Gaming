<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E7B1C" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Obsidian Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

  <!-- Subtle Crimson Perimeter Accent -->
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#DC2626" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Gold Shield -->
  <path d="M256 54 L424 114 V252 C424 358 348 428 256 462 C164 428 88 358 88 252 V114 Z"
        fill="#0D0D11" stroke="url(#goldGrad)" stroke-width="14" stroke-linejoin="round" />

  <!-- Inner Crimson Chevron Crest -->
  <path d="M256 84 L394 134 V246 C394 334 330 394 256 424 C182 394 118 334 118 246 V134 Z"
        fill="#14141A" stroke="url(#redGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Crimson Wing Geometry -->
  <polygon points="134,158 256,112 378,158 378,200 256,154 134,200" fill="url(#redGrad)" />

  <!-- Bold Geometric BSG Mark -->
  <text x="256" y="268" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="94" letter-spacing="4" fill="#FAFAFA">BSG</text>

  <!-- Championship Gold 804 Sub-crest -->
  <rect x="166" y="290" width="180" height="54" rx="8" fill="url(#goldGrad)" />
  <text x="256" y="329" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="38" letter-spacing="6" fill="#09090B">804</text>

  <!-- Bottom Gold Spear Point -->
  <polygon points="256,368 286,396 256,414 226,396" fill="url(#goldGrad)" />
</svg>
